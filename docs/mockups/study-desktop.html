<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cyph Study Desktop</title>
<link rel="stylesheet" href="bench2.css"><link rel="stylesheet" href="corner.css">
<style>
/* Study mode, desktop. Same Corner look as every page: bar on top, panels, Cyph bottom-right with nothing under him. */
.head{display:flex;align-items:flex-end;gap:16px;padding:14px 22px 0;position:relative;z-index:5}.head .sp{flex:1}
.hide{display:none!important}
.page{grid-template-columns:300px minmax(0,1fr) 360px;padding-top:12px}
.sub2{font:700 9px 'Pixelify Sans';letter-spacing:.24em;color:#58684a;margin:12px 2px 6px}
/* edge ring (the same "glowing edge = progress" idea as the phone widgets) */
.ring{--p:40;--c:var(--ne);width:var(--s,96px);height:var(--s,96px);border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),#1d2615 0);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 60%,transparent))}
.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0b130d}
.ring b{position:relative;font:700 calc(var(--s,96px)*.26) 'Pixelify Sans';color:var(--cr);text-align:center;line-height:1}
.ring b small{display:block;font:9px 'DM Mono';color:var(--dim);margin-top:3px;letter-spacing:.08em}
/* subject tiles */
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start}
.tile{position:relative;border-radius:12px;background:#0e150b;padding:12px 13px 11px;cursor:pointer;box-shadow:inset 0 0 0 1px #1d2815;transition:.12s;overflow:hidden}
.tile:hover{background:#142010;box-shadow:inset 0 0 0 2px var(--c)}
.tile .top{display:flex;align-items:center;gap:10px}
.tile .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:700 15px 'Pixelify Sans';color:#10150e;background:var(--c)}
.tile h5{font:italic 26px/1 'Instrument Serif';color:var(--cr)}
.tile p{font:11px 'DM Mono';color:var(--dim);margin-top:7px}
.tile .edge{height:5px;border-radius:3px;background:#1d2615;margin-top:9px;overflow:hidden}.tile .edge i{display:block;height:100%;width:var(--w);background:var(--c);box-shadow:0 0 8px var(--c)}
.tile .chips{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.tile .chip{font-size:10px;padding:2px 8px}
.tile.add{display:grid;place-items:center;border:2px dashed #2c3820;background:none;color:#8d9d78;font:italic 20px 'Instrument Serif';min-height:128px;box-shadow:none}
/* tests */
.test{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:#0e150b;margin-bottom:7px;box-shadow:inset 0 0 0 1px #1d2815}
.test .d{font:700 20px 'Pixelify Sans';color:var(--c);text-align:center;line-height:1}.test .d small{display:block;font:9px 'DM Mono';color:var(--dim);margin-top:2px}
.test h6{font:500 12.5px 'DM Mono';color:var(--cr)}.test p{font:11px 'DM Mono';color:var(--dim);margin-top:2px}
.blk{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:6px 9px;border-radius:7px;background:#0e150b;margin-bottom:5px;font:11.5px 'DM Mono';color:var(--cr)}
.blk small{color:var(--c)}.blk.cy2{box-shadow:inset 3px 0 var(--c)}
/* library */
.fold{font:12px/1.9 'DM Mono';color:#9fb08a}
.fold div{padding:0 8px;border-radius:5px;display:flex;gap:8px;align-items:center;cursor:pointer;justify-content:space-between}
.fold div:hover{background:#162010}.fold .on{background:#16241a;color:var(--cr);box-shadow:inset 0 0 0 1px var(--ne)}
.fold .d{color:var(--am);justify-content:flex-start}.fold .ind{padding-left:22px}
.fold .e{font:700 8.5px 'Pixelify Sans';letter-spacing:.14em;color:var(--ne)}.fold .e.w{color:var(--am)}
.drop{margin-top:8px;border:2px dashed #2c3820;border-radius:10px;padding:13px;text-align:center;font:italic 18px/1.1 'Instrument Serif';color:#8d9d78;cursor:pointer}
.drop:hover{border-color:var(--ne);color:var(--cr);background:rgba(93,255,122,.05)}
.drop small{display:block;font:10px 'DM Mono';color:var(--dim);margin-top:5px;font-style:normal}
.prog{height:7px;border-radius:4px;background:#05080a;box-shadow:inset 0 1px 3px #000;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--tl),var(--ne));box-shadow:0 0 8px var(--ne)}
.step{display:flex;gap:8px;align-items:center;font:11px 'DM Mono';color:#9fb08a;padding:3px 0}.step b{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:#1d2615;color:var(--dim)}
.step.ok b{background:var(--ne);color:#0d120a}.step.go b{background:var(--am);color:#1a1405;animation:bl 1s steps(1) infinite}.step.ok{color:var(--cr)}
/* reader */
.rd{flex:1;min-height:0;overflow:auto;padding:4px 6px 20px 2px}
.rd h2{font:italic 34px/1 'Instrument Serif';color:var(--cr);margin:2px 0 4px}
.rd h3{font:700 11px 'Pixelify Sans';letter-spacing:.22em;color:var(--am);margin:18px 0 6px}
.rd p,.rd li{font:italic 22px/1.3 'Instrument Serif';color:#d6d09a}.rd ul{margin:4px 0 0 20px}
.rd .meta{font:11px 'DM Mono';color:var(--dim)}
.math{display:inline-flex;align-items:center;gap:6px;font:italic 20px 'Instrument Serif';color:#fff3b8;background:#0f1b13;border-radius:6px;padding:1px 9px;box-shadow:inset 0 0 0 1px #20382a;vertical-align:middle}
.math.big{display:flex;justify-content:center;font-size:27px;padding:10px;margin:8px 0;border-radius:9px}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em;line-height:1.05;vertical-align:middle}.fr i{font-style:inherit;padding:0 3px}.fr i:first-child{border-bottom:1px solid currentColor}
.math sub,.math sup{font-size:.62em}
.cite{font:600 10px 'DM Mono';font-style:normal;background:var(--tl);color:#06140f;border-radius:3px;padding:1px 6px;margin:0 2px;vertical-align:2px;cursor:pointer}
.tb{width:100%;border-collapse:collapse;margin:6px 0;font:12px 'DM Mono'}.tb td,.tb th{padding:6px 10px;border:1px solid #20301a;color:#cfd8bc;text-align:left}.tb th{background:#12190f;color:var(--am);font:700 9.5px 'Pixelify Sans';letter-spacing:.14em}
.out{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 8px}
.out button{border:0;cursor:pointer;font:700 9.5px 'Pixelify Sans';letter-spacing:.12em;padding:6px 11px;border-radius:6px;background:#1d2615;color:#b9c7a3}
.out button.on{background:var(--ne);color:#0d120a;box-shadow:0 0 12px rgba(93,255,122,.4)}
.kt{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font:12px/1.4 'DM Mono'}.kt b{color:var(--ne);font-weight:500}.kt span{color:#c3cdb0}
/* tutor */
.thread{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:6px}
.msg.u{align-self:flex-end;max-width:84%;font:13.5px/1.4 'DM Mono';color:#cfe3f2;background:#15222d;border-radius:12px 12px 2px 12px;padding:8px 13px;box-shadow:inset 0 0 0 1px #20384a}
.steps{display:flex;flex-direction:column;gap:3px;font:11px 'DM Mono';color:var(--tl);padding-left:2px}.steps div:before{content:"▸ ";color:var(--am)}.steps b{color:var(--cr);font-weight:500}
.ans{font:italic 400 clamp(21px,1.5vw,26px)/1.24 'Instrument Serif';color:#e3dca5}
.ladder{display:flex;gap:6px;align-items:center;font:700 9px 'Pixelify Sans';letter-spacing:.14em;color:var(--dim)}
.ladder i{flex:1;height:5px;border-radius:3px;background:#1d2615;font-style:normal}.ladder i.on{background:var(--am);box-shadow:0 0 8px var(--am)}.ladder b{font-weight:700;color:var(--am)}
.logged{font:11px 'DM Mono';color:var(--co);padding:6px 10px;border-radius:7px;background:rgba(240,138,115,.1);box-shadow:inset 0 0 0 1px rgba(240,138,115,.35);align-self:flex-start}
.modes{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.cmdrow{display:flex;gap:8px;align-items:center;background:#05080aee;border-radius:12px;padding:11px 14px;box-shadow:0 0 0 1px var(--ln)}
.cmdrow input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:14px 'DM Mono'}.cmdrow .p{color:var(--ne)}
.pass{border-radius:9px;background:#07100a;box-shadow:0 0 0 1px #1d3a32;padding:10px 12px}
.pass small{display:block;font:700 9px 'Pixelify Sans';letter-spacing:.18em;color:var(--tl);margin-bottom:4px}
.pass p{font:italic 18px/1.25 'Instrument Serif';color:#cfd8bc}.pass mark{background:rgba(93,255,122,.22);color:var(--cr);padding:0 3px;border-radius:2px}
/* cards */
.cd{border-radius:11px;background:#0e150b;box-shadow:inset 0 0 0 1px #1d2815;padding:11px 12px;margin-bottom:10px}
.cd.sel{box-shadow:inset 0 0 0 2px var(--am)}
.cd .q{font:italic 20px/1.18 'Instrument Serif';color:var(--cr)}.cd .a{font:12px/1.45 'DM Mono';color:#b8c6a4;margin-top:6px}
.cd .row{display:flex;gap:6px;align-items:center;margin-top:9px}.cd .row .src{font:10px 'DM Mono';color:var(--bl);margin-right:auto}
.cd img,.cd .pic{width:100%;height:78px;border-radius:7px;margin-top:8px;background:#05080a;display:block}
.flash{perspective:700px;height:200px;cursor:pointer}
.flash>div{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.flash.flip>div{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;padding:16px;text-align:center;backface-visibility:hidden;font:italic 26px/1.15 'Instrument Serif'}
.flash .f{background:#16241a;box-shadow:inset 0 0 0 2px var(--ne);color:var(--cr)}.flash .b{background:var(--ne);color:#0d120a;transform:rotateY(180deg)}
.flash small{position:absolute;left:12px;top:9px;font:700 9px 'Pixelify Sans';letter-spacing:.18em;opacity:.7;font-style:normal}
.streak{display:flex;gap:5px}.streak i{flex:1;height:44px;border-radius:4px;background:#161d10;position:relative}.streak i b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--ne),var(--tl));border-radius:4px;height:var(--h)}
.weak{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;background:#0e150b;margin-bottom:6px;font:12px 'DM Mono';color:var(--cr)}
.weak i{font:700 9px 'Pixelify Sans';letter-spacing:.12em;font-style:normal;color:var(--co)}
/* paper */
.paper{background:#e9e1c6;border-radius:6px;padding:16px 18px;color:#2a2a22;font:italic 19px/1.3 'Instrument Serif';box-shadow:0 8px 24px #000a}
.paper b{font:500 10px 'DM Mono';letter-spacing:.2em;color:#7a6a3a;display:block;margin-bottom:5px}
.hw{margin-top:10px;border-radius:8px;background:#f4eed6;padding:8px 12px;font:italic 22px/1.2 'Special Elite','Instrument Serif';color:#27406b;position:relative}
.hw u{text-decoration:wavy underline #c0392b}
.mk{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:8px 10px;border-radius:8px;background:#0e150b;margin-bottom:6px;font:12px/1.4 'DM Mono';color:#c3cdb0}
.mk b{font:700 14px 'Pixelify Sans';color:var(--ne);text-align:center}.mk.x b{color:var(--co)}.mk.h b{color:var(--am)}
.pill{font:700 10px 'Pixelify Sans';letter-spacing:.14em;padding:4px 10px;border-radius:12px;background:#1d2615;color:#b9c7a3}
.note{font:italic 17px 'Instrument Serif';color:#8d9d78;margin-top:8px}

.subj{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 9px;border-radius:9px;background:#10170b;cursor:pointer;box-shadow:inset 0 0 0 1px #1d2815;margin-bottom:6px;transition:.12s}
.subj:hover{background:#162010}.subj.on{background:#16241a;box-shadow:inset 0 0 0 2px var(--ne)}
.subj .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 14px 'Pixelify Sans';color:#10150e}
.subj h5{font:500 13px 'DM Mono';color:var(--tx)}
.eq sub{vertical-align:-.3em}.eq sup{vertical-align:.5em}
.page{grid-template-columns:290px minmax(0,1fr) 340px}
.big{font:italic 400 110px/.9 'Instrument Serif';color:var(--cr)}
.row2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1b2514;font:12.5px 'DM Mono';color:var(--cr)}
.row2:last-child{border:0}.row2 span:last-child{color:var(--dim)}
.sbtn{display:block;width:100%;margin-bottom:6px}
.bar2{height:6px;border-radius:3px;background:#1d2615;overflow:hidden;margin:14px 0 6px}.bar2 i{display:block;height:100%;background:var(--ne);box-shadow:0 0 8px var(--ne)}
.subj .n{font:700 11px 'Pixelify Sans';letter-spacing:.1em;color:var(--ne)}
.fl{display:flex;justify-content:space-between;padding:7px 10px;border-radius:7px;background:#0e150a;font:12px 'DM Mono';color:#9fb08a;margin-bottom:5px;cursor:pointer}.fl.on{background:#16241a;color:var(--cr);box-shadow:inset 0 0 0 1px var(--ne)}.fl i{font:700 9px 'Pixelify Sans';letter-spacing:.14em;color:var(--ne);font-style:normal}
.mid{display:flex;flex-direction:column;min-height:0}
.rd{flex:1;min-height:0;overflow:auto;padding:4px 6px 20px 2px}
.rd h2{font:italic 34px/1 'Instrument Serif';color:var(--cr);margin:2px 0 8px}
.rd h3{font:700 11px 'Pixelify Sans';letter-spacing:.22em;color:var(--am);margin:20px 0 6px}
.rd p{font:italic 22px/1.3 'Instrument Serif';color:#d6d09a;margin:0 0 6px}
.eq{display:flex;justify-content:center;font:italic 27px 'Instrument Serif';color:#fff3b8;background:#0f1b13;border-radius:9px;padding:10px;margin:8px 0;box-shadow:inset 0 0 0 1px #20382a}
.eq sub,.eq sup{font-size:.62em}
.ph2{display:flex;gap:6px;margin-bottom:10px}
</style></head><body>
<div class="deck"><div id="bar" class="bar"></div>
 <div class="head"><h1 class="t"><em id="eyb">STUDY MODE</em><span id="ttl">Today</span></h1><div class="sp"></div><div class="tabs" id="tabs"></div></div>
 <div class="page"><div class="cp scroll" id="L"></div><div class="cp mid" id="M"></div><div class="cp scroll" id="R"></div></div>
</div>

<script src="cyph-rig.js"></script><script src="cyph-engine.js"></script><script src="bench-common.js"></script><script src="corner.js"></script>
<script>
const $ = (id) => document.getElementById(id); shell("STUDY MODE"); const api = buddy(5);
const SUBJ = [["Math","M","#5dff7a",4],["Chemistry","C","#d9984a",9],["Physics","P","#5b9fb8",6],["Amath","A","#b392f0",5],["English","E","#f3ecb2",3],["SS","S","#f08a73",2],["Geog","G","#2f9d8f",0]];
const TABS = [["today","TODAY"],["notes","NOTES"],["tutor","TUTOR"],["cards","CARDS"],["papers","PAPERS"]];
let tab = "today", si = 1, ct = "rev";
const fr = (a, b) => `<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const V = {
 today: () => ({
  M: `<div class="lbl">Cards due <b>about 11 min</b></div><div class="big">23</div><div class="bar2"><i style="width:38%"></i></div><div style="font:11px 'DM Mono';color:var(--dim)">14 of 37 done</div>
      <button class="btn go" style="margin:16px 0 22px;align-self:flex-start" data-t="cards">START REVIEW</button>
      <div class="lbl">Tests</div>
      <div class="test" style="--c:#f08a73"><div class="d">12<small>DAYS</small></div><div><h6>Chemistry</h6><p>Paper 1</p></div></div>
      <div class="test" style="--c:#d9984a"><div class="d">19<small>DAYS</small></div><div><h6>Amath</h6><p>Quadratics</p></div></div>
      <div class="test" style="--c:#5b9fb8"><div class="d">26<small>DAYS</small></div><div><h6>Geog</h6><p>Fieldwork</p></div></div>`,
  R: `<div class="lbl">Needs work</div><div class="weak"><span>Chem · Mole ratio</span><i>5</i></div><div class="weak"><span>Physics · Moments</span><i>4</i></div><div class="weak"><span>Amath · Completing the square</span><i>3</i></div>
      <div class="lbl" style="margin-top:18px">This week</div><div class="streak"><i><b style="--h:60%"></b></i><i><b style="--h:85%"></b></i><i><b style="--h:30%"></b></i><i><b style="--h:70%"></b></i><i><b style="--h:44%"></b></i><i><b style="--h:12%"></b></i><i><b style="--h:0%"></b></i></div>`}),
 notes: () => ({
  M: `<div class="lbl">Acids and bases.pdf <b>12 pages</b></div><div class="tabs" style="margin-bottom:12px"><button class="on">NOTES</button><button>SUMMARY</button><button>TERMS</button><button>GUIDE</button><button>QUESTIONS</button><button>ORIGINAL</button></div>
      <div class="rd"><h2>Acids, bases and pH</h2><h3>PH</h3><p>Below 7 is acidic, above 7 is alkaline.</p><div class="eq">pH = −log<sub>10</sub>[H<sup>+</sup>]</div>
      <h3>MOLES IN A SOLUTION</h3><p>Convert the volume to dm³ first. <span class="cite">p.5</span></p><div class="eq">n = c × ${fr("V","1000")}</div>
      <h3>INDICATORS</h3><table class="tb"><tr><th>INDICATOR</th><th>ACID</th><th>ALKALI</th></tr><tr><td>Litmus</td><td>red</td><td>blue</td></tr><tr><td>Methyl orange</td><td>red</td><td>yellow</td></tr></table></div>`,
  R: `<div class="lbl">Importing</div><div class="row2"><span>Mole worksheet.pdf</span><span>62%</span></div><div class="prog"><i style="width:62%"></i></div>
      <div class="lbl" style="margin-top:22px">Next</div><button class="btn go sbtn" data-t="drafts">MAKE CARDS (12)</button><button class="btn sbtn" data-t="tutor">QUIZ ME</button>`}),
 tutor: () => ({
  M: `<div class="lbl">Tutor</div><div class="thread">
      <div class="msg u">25.0 cm³ of 0.10 mol/dm³ NaOH. How many moles?</div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="ladder"><b>HINT</b><i class="on"></i><i class="on"></i><i></i><i></i><span>2 OF 4</span></div><div class="ans">You wrote <span class="math">n = c × ${fr("V","1000")}</span> in your notes <span class="cite">1</span>. What unit is the 25.0 in?</div></div>
      <div class="msg u">cm³, so I divide by 1000?</div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="ladder"><b>HINT</b><i class="on"></i><i class="on"></i><i class="on"></i><i></i><span>3 OF 4</span></div><div class="ans">Yes, that's the step people skip. Now multiply by 0.10.</div></div>
      <div class="logged">Logged: mole ratio, unit conversion</div></div>
      <div class="cmdrow" style="margin-top:8px"><span class="p">▸</span><input placeholder="answer or ask…"><button class="key mic">MIC</button><button class="key live">SEND</button></div>`,
  R: `<div class="lbl">Source</div><div class="pass"><small>MY MOLE NOTES · §2</small><p>…the amount in moles is <mark>n = c × V / 1000</mark> where V is in cm³…</p></div>
      <div class="lbl" style="margin-top:22px">Practice</div><button class="btn sbtn">WORKED PROBLEM</button><button class="btn sbtn">STRUCTURED</button><button class="btn sbtn">SOURCE-BASED</button><button class="btn sbtn">ESSAY</button><button class="btn sbtn">PAST PAPER</button>`}),
 cards: () => ({
  M: `<div class="lbl">Cards</div><div class="tabs" style="margin-bottom:14px"><button class="${ct === "rev" ? "on" : ""}" data-c="rev">REVIEW 23</button><button class="${ct === "drf" ? "on" : ""}" data-c="drf">DRAFTS 12</button></div>` + (ct === "rev" ?
      `<div class="flash" id="fl" style="height:230px"><div><div class="f"><small>QUESTION</small>Moles in 25.0 cm³ of 0.10 mol/dm³ NaOH?</div><div class="b"><small>ANSWER</small>0.0025 mol</div></div></div>
       <div style="display:flex;gap:8px;margin-top:12px"><button class="btn red" style="flex:1;padding:13px">AGAIN</button><button class="btn" style="flex:1;padding:13px">HARD</button><button class="btn go" style="flex:1;padding:13px">GOT IT</button></div>`
      : `<div class="scroll" style="flex:1">
       <div class="cd"><div class="q">Formula for moles in a solution?</div><div class="a">n = c × V ÷ 1000</div><div class="row"><span class="src">p.5</span><button class="btn sm">EDIT</button><button class="btn sm red">SKIP</button><button class="btn sm go">APPROVE</button></div></div>
       <div class="cd"><div class="q">Methyl orange colour in alkali?</div><div class="a">Yellow</div><div style="display:flex;gap:6px;margin-top:8px"><i style="width:34px;height:44px;border-radius:5px;background:#e8654a"></i><i style="width:34px;height:44px;border-radius:5px;background:#f0b64a"></i></div><div class="row"><span class="src">p.9</span><button class="btn sm">EDIT</button><button class="btn sm red">SKIP</button><button class="btn sm go">APPROVE</button></div></div>
       <div class="cd"><div class="q">Why repeat a titration?</div><div class="a">Concordant results, reliable average</div><div class="row"><span class="src">Titration</span><button class="btn sm">EDIT</button><button class="btn sm red">SKIP</button><button class="btn sm go">APPROVE</button></div></div></div>`),
  R: `<div class="lbl">Stats</div><div style="display:flex;gap:14px;align-items:center"><div class="ring" style="--s:84px;--p:38;--c:var(--am)"><b>14<small>DONE</small></b></div><div style="font:12px/1.7 'DM Mono';color:#9fb08a">81% right<br>4 day streak</div></div>
      <div class="lbl" style="margin-top:22px">Due by subject</div><div class="weak"><span>Chemistry</span><i style="color:var(--ne)">9</i></div><div class="weak"><span>Physics</span><i style="color:var(--ne)">6</i></div><div class="weak"><span>Amath</span><i style="color:var(--ne)">5</i></div>`}),
 papers: () => ({

function draw(say) {
